# --- Datasource (H2 en memoria) ---
spring.datasource.url=jdbc:h2:mem:playlistdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DATASOURCE_USERNAME:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Usuarios de la API (HTTP Basic Auth) ---
app.security.user.name=${BASIC_USER:user}
app.security.user.password=${BASIC_PASSWORD:playlist}
